# Intégration continue : tests du service Rust (dont le mini-fuzz des parseurs réseau), compilation du
# service et de l'interface C#, sur Windows. Les exécutables compilés sont gardés comme artefacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Tests du service
        working-directory: service-rs
        run: cargo test --release

      - name: Compilation du service
        working-directory: service-rs
        run: cargo build --release

      - name: Compilation de l'interface
        shell: pwsh
        run: ./compiler.ps1 -InterfaceSeulement

      - name: Paquet MSI (WiX 3.14, licence MS-RL)
        shell: pwsh
        run: |
          Copy-Item service-rs/target/release/der4tizer-svc.exe bin/deR4TizerSvc.exe
          $wix = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile "$wix.zip"
          $h = (Get-FileHash "$wix.zip" -Algorithm SHA256).Hash
          if ($h -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw "Archive WiX inattendue ($h)." }
          Expand-Archive "$wix.zip" $wix
          $env:WIX = $wix
          ./construire-msi.ps1

      - name: Artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deR4Tizer-${{ github.sha }}
          path: |
            bin/deR4Tizer.msi
            bin/deR4TizerSvc.exe
            bin/deR4Tizer.exe
