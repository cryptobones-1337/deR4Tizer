# Préparation d'une version : à chaque tag « v4.3 », tests et compilation des exécutables, sans aucun secret.
#
# La signature ne se fait PAS dans GitHub : la clé du certificat de signature de code reste chez l'autorité
# (certificat « dans le nuage », session SimplySign du mainteneur). Le mainteneur télécharge l'artefact
# « executables », puis lance signer-version.ps1 sur son poste : contrôle que la clé du certificat est épinglée
# dans le service, signature, MSI signé, manifeste et empreintes. La publication de la version GitHub est ensuite
# une décision du mainteneur, faite à la main (CLAUDE.md, section 6).
#
# Variable de dépôt CLE_SIGNATURE (non secrète) : empreinte SHA-256 de la clé publique du certificat (et de la
# suivante, séparées par une virgule), épinglée dans le binaire ; signer-version.ps1 refuse de signer un service
# où elle manque.
name: Publication

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  compiler:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Le tag correspond à la version du code
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Select-String -Path service-rs/src/commun.rs -Pattern 'pub const VERSION: &str = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG différent de la version du code ($v) : les postes se remettraient à jour en boucle." }

      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Tests
        working-directory: service-rs
        run: cargo test --release --locked

      - name: Compilation
        shell: pwsh
        env:
          # Clés de signature épinglées dans le binaire : la mise à jour automatique n'installe que des
          # versions signées par l'une d'elles (variable de dépôt, non secrète)
          DER4TIZER_CLES_SIGNATURE: ${{ vars.CLE_SIGNATURE }}
        run: |
          cd service-rs; cargo build --release --locked; cd ..
          ./compiler.ps1 -InterfaceSeulement
          Copy-Item service-rs/target/release/der4tizer-svc.exe bin/deR4TizerSvc.exe
          Get-FileHash bin/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content bin/SHA256SUMS-non-signes.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: executables
          path: |
            bin/deR4TizerSvc.exe
            bin/deR4Tizer.exe
            bin/SHA256SUMS-non-signes.txt
