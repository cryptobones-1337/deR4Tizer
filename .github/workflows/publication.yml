# Publication d'une version : à chaque tag « v4.3 », compilation, signature (si un certificat est configuré),
# empreintes SHA-256 et manifeste pour la mise à jour automatique, puis publication de la version GitHub.
#
# Trois jobs, pour que le certificat ne côtoie jamais de code tiers :
#   compiler  sans secret : tests et compilation (les scripts de compilation des dépendances s'exécutent ici)
#   signer    environnement « publication » (secrets, approbation) : reçoit seulement les exécutables, les
#             signe, construit le MSI avec WiX (archive vérifiée par son empreinte), le signe, écrit le manifeste,
#             puis VÉRIFIE les trois signatures (verifier-signatures.ps1) : échec fermé
#   publier   crée la version GitHub avec les fichiers signés ; ne tourne que si la vérification a réussi
#
# Secrets facultatifs (environnement « publication ») : CERTIFICAT_PFX (fichier .pfx en base64) et
# CERTIFICAT_MOT_DE_PASSE. Variable de dépôt CLE_SIGNATURE : empreinte SHA-256 de la clé publique du
# certificat (et de la suivante, séparées par une virgule), épinglée dans le binaire. Sans certificat, ou avec
# un certificat dont la clé n'est pas dans CLE_SIGNATURE, ou sans CLE_SIGNATURE, aucune version n'est publiée
# (plan avant la première version signée, bloc 0.1, 2026-11-21) : tant que la signature se fait sur le poste du
# mainteneur (Certum, clé dans SimplySign, pas de .pfx), pousser un tag v* échoue à la vérification. La version est
# alors signée et déposée en brouillon par signer-version.ps1, depuis l'artefact « a-signer » de cette exécution
# (procédure : docs/publication/signature-locale.md).
# Limite (audit de #226, S226-02) : cette garde protège contre l'accident, pas contre quelqu'un qui peut pousser un
# tag (le workflow exécuté est celui du commit tagué) ; les vraies protections sont la règle sur les tags v*
# (création réservée au mainteneur), l'approbation de l'environnement « publication » sur signer et publier, et la
# vérification sur chaque poste (clé épinglée, chaîne et révocation).
name: Publication

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  compiler:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Le nom du tag n'est jamais inséré dans un script : il passe par l'environnement et doit être de la forme
      # vX.Y ou vX.Y.Z (audit de #226, S226-01)
      - name: Le tag correspond à la version du code
        shell: pwsh
        env:
          REF: ${{ github.ref_name }}
        run: |
          if ($env:REF -cnotmatch '^v\d+\.\d+(\.\d+)?$') { throw "Tag refusé : forme vX.Y ou vX.Y.Z attendue." }
          $v = (Select-String -Path service-rs/src/commun.rs -Pattern 'pub const VERSION: &str = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:REF) { throw "Tag $env:REF différent de la version du code ($v) : les postes se remettraient à jour en boucle." }

      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Tests
        working-directory: service-rs
        run: cargo test --release

      - name: Compilation
        shell: pwsh
        env:
          # Clés de signature épinglées dans le binaire : la mise à jour automatique n'installe que des
          # versions signées par l'une d'elles (variable de dépôt, non secrète)
          DER4TIZER_CLES_SIGNATURE: ${{ vars.CLE_SIGNATURE }}
        run: |
          cd service-rs; cargo build --release; cd ..
          ./compiler.ps1 -InterfaceSeulement
          Copy-Item service-rs/target/release/der4tizer-svc.exe bin/deR4TizerSvc.exe

      # Exécutables à clé épinglée, non signés : jamais publiés tels quels. Le job « signer » les reprend, et la
      # signature locale (signer-version.ps1, bloc 1.1) les télécharge et vérifie leur empreinte avant de les signer ;
      # gardés 7 jours pour laisser le temps de signer sur le poste du mainteneur
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a-signer
          path: |
            bin/deR4TizerSvc.exe
            bin/deR4Tizer.exe
          retention-days: 7

  signer:
    needs: compiler
    runs-on: windows-latest
    # Environnement GitHub « publication » : y ranger les secrets de signature et exiger une approbation
    # (Settings > Environments) ; protéger aussi les tags v* (Settings > Rules)
    environment: publication
    env:
      # Les secrets ne sont pas lisibles dans une condition « if » : on passe par une variable
      AVEC_CERTIFICAT: ${{ secrets.CERTIFICAT_PFX != '' }}
    steps:
      # Seulement les sources du paquet (construire-msi.ps1, installeur\) : rien n'est compilé ici
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: a-signer
          path: bin

      - name: WiX 3.14 (licence MS-RL), archive vérifiée
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile "$wix.zip"
          $h = (Get-FileHash "$wix.zip" -Algorithm SHA256).Hash
          if ($h -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw "Archive WiX inattendue ($h)." }
          Expand-Archive "$wix.zip" $wix
          "WIX=$wix" >> $env:GITHUB_ENV

      - name: Signature des exécutables
        if: env.AVEC_CERTIFICAT == 'true'
        env:
          CERTIFICAT: ${{ secrets.CERTIFICAT_PFX }}
          MOT_DE_PASSE: ${{ secrets.CERTIFICAT_MOT_DE_PASSE }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificat.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICAT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:MOT_DE_PASSE /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 bin/deR4Tizer.exe bin/deR4TizerSvc.exe
          if ($LASTEXITCODE) { throw 'Échec de la signature.' }
          "PFX=$pfx" >> $env:GITHUB_ENV

      - name: Paquet MSI
        shell: pwsh
        env:
          MOT_DE_PASSE: ${{ secrets.CERTIFICAT_MOT_DE_PASSE }}
        run: |
          ./construire-msi.ps1
          if ($env:PFX -and (Test-Path $env:PFX)) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $env:PFX /p $env:MOT_DE_PASSE /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d deR4Tizer bin/deR4Tizer.msi
            if ($LASTEXITCODE) { throw 'Échec de la signature du paquet.' }
          }

      - name: Effacement du certificat
        if: always()
        shell: pwsh
        run: if ($env:PFX -and (Test-Path $env:PFX)) { Remove-Item $env:PFX -Force }

      - name: Manifeste de mise à jour
        shell: pwsh
        env:
          REF: ${{ github.ref_name }}
          DEPOT: ${{ github.repository }}
        run: |
          # Un seul fichier, le paquet MSI : c'est lui que les postes installent, et sa version y est lue après
          # vérification de sa signature (les exécutables restent joints à la version pour une installation manuelle)
          if ($env:REF -cnotmatch '^v\d+\.\d+(\.\d+)?$') { throw "Tag refusé : forme vX.Y ou vX.Y.Z attendue." }
          $base = "https://github.com/$env:DEPOT/releases/download/$env:REF"
          $fichiers = foreach ($n in 'deR4Tizer.msi') {
            [ordered]@{ Nom = $n; Url = "$base/$n"; Sha256 = (Get-FileHash "bin/$n" -Algorithm SHA256).Hash.ToLower() }
          }
          [ordered]@{ Version = $env:REF.TrimStart('v'); Fichiers = @($fichiers) } | ConvertTo-Json -Depth 4 | Set-Content bin/manifeste.json -Encoding utf8NoBOM

      # Échec fermé : rien n'est transmis au job « publier » si un des trois fichiers n'est pas signé (valide,
      # horodaté) par une clé de CLE_SIGNATURE ; la présence du secret ne suffit pas
      - name: Vérification des signatures (échec fermé)
        shell: pwsh
        env:
          CLES: ${{ vars.CLE_SIGNATURE }}
        run: ./verifier-signatures.ps1 -Cles "$env:CLES" -Fichiers bin/deR4Tizer.msi, bin/deR4TizerSvc.exe, bin/deR4Tizer.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: version
          path: |
            bin/deR4Tizer.msi
            bin/deR4TizerSvc.exe
            bin/deR4Tizer.exe
            bin/manifeste.json
          retention-days: 1

  publier:
    needs: signer
    runs-on: ubuntu-latest
    # Approbation de l'environnement « publication » exigée aussi ici (audit de #226, S226-02)
    environment: publication
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: version
          path: bin

      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          DEPOT: ${{ github.repository }}
        run: |
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Tag refusé : forme vX.Y ou vX.Y.Z attendue."; exit 1; }
          gh release create "$REF" bin/deR4Tizer.msi bin/deR4TizerSvc.exe bin/deR4Tizer.exe bin/manifeste.json --repo "$DEPOT" --title "deR4Tizer $REF" --generate-notes
