# Publication d'une version : à chaque tag « v4.1 », compilation, signature (si un certificat est configuré),
# empreintes SHA-256 et manifeste pour la mise à jour automatique, puis publication de la version GitHub.
# Secrets facultatifs pour la signature : CERTIFICAT_PFX (fichier .pfx en base64) et CERTIFICAT_MOT_DE_PASSE.
# Sans eux, les binaires ne sont pas signés et les postes signalent la version sans l'installer.
name: Publication

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publier:
    runs-on: windows-latest
    # Environnement GitHub « publication » : y ranger les secrets de signature et exiger une approbation
    # (Settings > Environments) ; protéger aussi les tags v* (Settings > Rules)
    environment: publication
    env:
      # Les secrets ne sont pas lisibles dans une condition « if » : on passe par une variable
      AVEC_CERTIFICAT: ${{ secrets.CERTIFICAT_PFX != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Le tag correspond à la version du code
        shell: pwsh
        run: |
          $v = (Select-String -Path service-rs/src/commun.rs -Pattern 'pub const VERSION: &str = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} différent de la version du code ($v) : les postes se remettraient à jour en boucle." }

      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Tests
        working-directory: service-rs
        run: cargo test --release

      - name: Compilation
        shell: pwsh
        env:
          # Empreinte de la clé publique du certificat de signature, épinglée dans le binaire : la mise à jour
          # automatique n'installe que des versions signées par cette clé (variable d'environnement GitHub, non secrète)
          DER4TIZER_CLE_SIGNATURE: ${{ vars.CLE_SIGNATURE }}
        run: |
          cd service-rs; cargo build --release; cd ..
          ./compiler.ps1 -InterfaceSeulement
          Copy-Item service-rs/target/release/der4tizer-svc.exe bin/deR4TizerSvc.exe

      - name: Signature
        if: env.AVEC_CERTIFICAT == 'true'
        env:
          CERTIFICAT: ${{ secrets.CERTIFICAT_PFX }}
          MOT_DE_PASSE: ${{ secrets.CERTIFICAT_MOT_DE_PASSE }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificat.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICAT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:MOT_DE_PASSE /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 bin/deR4Tizer.exe bin/deR4TizerSvc.exe
          if ($LASTEXITCODE) { throw 'Échec de la signature.' }
          "PFX=$pfx" >> $env:GITHUB_ENV

      - name: Paquet MSI (WiX 3.14, licence MS-RL)
        shell: pwsh
        env:
          MOT_DE_PASSE: ${{ secrets.CERTIFICAT_MOT_DE_PASSE }}
        run: |
          $wix = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile "$wix.zip"
          Expand-Archive "$wix.zip" $wix
          $env:WIX = $wix
          ./construire-msi.ps1
          if ($env:PFX -and (Test-Path $env:PFX)) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $env:PFX /p $env:MOT_DE_PASSE /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d deR4Tizer bin/deR4Tizer.msi
            if ($LASTEXITCODE) { throw 'Échec de la signature du paquet.' }
            Remove-Item $env:PFX
          }

      - name: Manifeste de mise à jour
        shell: pwsh
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $fichiers = foreach ($n in 'deR4Tizer.msi', 'deR4TizerSvc.exe', 'deR4Tizer.exe') {
            [ordered]@{ Nom = $n; Url = "$base/$n"; Sha256 = (Get-FileHash "bin/$n" -Algorithm SHA256).Hash.ToLower() }
          }
          [ordered]@{ Version = '${{ github.ref_name }}'.TrimStart('v'); Fichiers = @($fichiers) } | ConvertTo-Json -Depth 4 | Set-Content bin/manifeste.json -Encoding utf8NoBOM

      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} bin/deR4Tizer.msi bin/deR4TizerSvc.exe bin/deR4Tizer.exe bin/manifeste.json --title "deR4Tizer ${{ github.ref_name }}" --generate-notes
